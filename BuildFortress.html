<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Build Fortress</title>
    
    <!-- Font (optional but recommended early) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="Assets/SHIELDICON.png">
    <link rel="stylesheet" href="Styles/Common.css" />
    <link rel="stylesheet" href="Styles/BuildFortress.css" />
  </head>
  <body>
    <div class="fortress-page">

      <header>
        <h1>BUILD YOUR FORTRESS</h1>

        <p class="tagline">
          A STRONG FORTRESS IS BUILT BEFORE THE BATTLE...
        </p>

        <img src="Assets/Fortress.png" class="fortress-icon">
      </header>

      <section class="fortress-panels">

        <div class="panel defenses-panel">
          <h2 class="panel-heading">CHOOSE YOUR DEFENSES</h2>
          <p class="panel-description">SELECT CATEGORIES TO BLOCK</p>

          <!-- Rendered from storage by renderCategoryList(). The three starting
               categories are only seeds — they can be renamed, re-stocked or
               removed like any category the user adds. -->
          <div id="categoryList" class="category-list"></div>

          <button type="button" class="add-category-btn" id="addCategoryBtn">
            + New category
          </button>
        </div>

        <div class="panel standards-panel">
          <h2 class="panel-heading">SET YOUR STANDARDS</h2>
          <p class = "panel-description">TASKS TO EARN ACCESS</p>
          <p class="panel-note">
            Applies to every blocked site that isn't governed by a category with
            standards of its own.
          </p>
          <div class="task-row">
            <button class="task-btn" id = "addTaskBtn">
              Add task
            </button>
          </div>

          <!-- Shared by every task (and by the no-task case): the cooldown that
               has to elapse on the blocked page before UNLOCK SITE goes live.
               Rendered by renderCooldownBlock() rather than written out here, so
               the per-category override fields below are guaranteed to be the
               same controls with the same limits. -->
          <div class="cooldown-block" id="fortressCooldown"></div>
        </div>

      </section>

      <button class="save-btn">
        SAVE FORTRESS
      </button>

      <!-- Friction gate for removing a task. Mirrors the popup's block-removal
           gate: name what's being given up, show the streak at stake, and hold
           the confirm button shut long enough for the impulse to pass. -->
      <div id="removeTaskModal" class="modal-overlay" hidden>
        <div class="modal-box">
          <h2 class="modal-title">REMOVE THIS TASK?</h2>
          <p id="removeTaskModalStreak" class="modal-streak"></p>
          <p id="removeTaskModalText" class="modal-text"></p>
          <div class="modal-actions">
            <button id="removeTaskModalCancel" class="modal-btn modal-btn-secondary">CANCEL</button>
            <button id="removeTaskModalConfirm" class="modal-btn" disabled>CONFIRM</button>
          </div>
        </div>
      </div>

      <!-- Deleting a category that is currently switched on takes real blocks
           down with it, so it goes through the same gate as removing a block or
           a task rather than vanishing on one click. -->
      <div id="removeCategoryModal" class="modal-overlay" hidden>
        <div class="modal-box">
          <h2 class="modal-title">DELETE THIS CATEGORY?</h2>
          <p id="removeCategoryModalStreak" class="modal-streak"></p>
          <p id="removeCategoryModalText" class="modal-text"></p>
          <div class="modal-actions">
            <button id="removeCategoryModalCancel" class="modal-btn modal-btn-secondary">CANCEL</button>
            <button id="removeCategoryModalConfirm" class="modal-btn" disabled>CONFIRM</button>
          </div>
        </div>
      </div>

    </div>
  <script src="Stats.js"></script>
  <script src="Tasks.js"></script>
  <script src="Categories.js"></script>
  <script src="Seal.js"></script>
  <script src="BuildFortress.js"></script>
  </body>
</html>
