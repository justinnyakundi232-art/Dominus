[package]
name = "dominus"
version = "0.1.0"
description = "Dominus for the desktop - the keep."
authors = ["AJ7 Tech"]
license = "MIT"
repository = "https://github.com/justinnyakundi232-art/Dominus"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dominus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# tray-icon is not in Tauri 2's default features; the tray is how you get
# back to a window that is meant to stay out of the way.
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"

# The loopback service. See ../SYNC-PROTOCOL.md.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
rand = "0.9"

# The loopback service is tested through its own router with oneshot, so what
# is exercised is the thing that is served rather than a model of it.
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
